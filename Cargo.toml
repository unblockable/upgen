[package]
name = "upgen"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "The Unidentified Protocol Generator"
license-file = "LICENSE"

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
serde_json = "1.0.154"

[features]
cli = ["dep:clap"]

[[bin]]
name = "upgen"
path = "src/main.rs"
required-features = ["cli"]
